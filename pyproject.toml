[project]
name = "cortex"
version = "0.2.0"
description = "PULSE8.ai Cortex — agent-native knowledge OS built on Markdown files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "mcp[cli]>=1.0.0",
    "networkx>=3.4",
    "python-frontmatter>=1.1.0",
    "watchfiles>=1.0.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.42.0",
    "httpx>=0.28.0",
    "openai>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pylint.main]
load-plugins = []

[tool.pylint."messages control"]
disable = [
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
    "too-many-return-statements",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "broad-exception-caught",
    "import-outside-toplevel",
    "global-statement",
    "duplicate-code",
    "redefined-outer-name",
    "missing-class-docstring",
    "missing-function-docstring",
    "protected-access",
    "use-implicit-booleaness-not-comparison",
]

[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
