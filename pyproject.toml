[project]
name = "cortex"
version = "0.1.0"
description = "Agent-native knowledge OS built on Markdown files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "mcp[cli]>=1.0.0",
    "networkx>=3.4",
    "python-frontmatter>=1.1.0",
    "watchfiles>=1.0.0",
    "pydantic-settings>=2.7.0",
    "anthropic>=0.42.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
