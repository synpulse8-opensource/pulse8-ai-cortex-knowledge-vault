services:
  qmd:
    container_name: qmd
    build:
      context: ./docker/qmd
    volumes:
      - ${VAULT_DIR:-./example_vault}:/vault:ro
      - qmd-cache:/home/qmd/.cache/qmd
    environment:
      - VAULT_PATH=/vault
      - VAULT_WIKI_DIR=${VAULT_WIKI_DIR:-wiki}
      - QMD_PORT=3100
      - QMD_REFRESH_INTERVAL_SECONDS=${QMD_REFRESH_INTERVAL_SECONDS:-900}
      - QMD_EMBED_TIMEOUT_MS=${QMD_EMBED_TIMEOUT_MS:-600000}
    ports:
      - "3100:3100"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  cortex:
    container_name: pulse8-ai-cortex
    build: .
    ports:
      - "8420:8420"
    volumes:
      - ${VAULT_DIR:-./example_vault}:/vault
      - ${INGEST_DIR:-./ingest}:/ingest:ro
    environment:
      - CORTEX_VAULT_PATH=/vault
      - CORTEX_VAULT_RAW_DIR=${VAULT_RAW_DIR:-raw}
      - CORTEX_VAULT_WIKI_DIR=${VAULT_WIKI_DIR:-wiki}
      - CORTEX_LLM_API_KEY=${LLM_API_KEY:-}
      - CORTEX_LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - CORTEX_COMPILER_MODEL=${COMPILER_MODEL:-anthropic/claude-sonnet-4}
      - CORTEX_COMPILER_VISION_MODEL=${COMPILER_VISION_MODEL:-}
      - CORTEX_MCP_TRANSPORT=http
      - CORTEX_QMD_URL=http://qmd:3100
      - CORTEX_QMD_REFRESH_INTERVAL_SECONDS=${QMD_REFRESH_INTERVAL_SECONDS:-900}
      - CORTEX_QMD_CACHE_TTL_SECONDS=${QMD_CACHE_TTL_SECONDS:-30}
      - CORTEX_QMD_SEARCH_MODE=${QMD_SEARCH_MODE:-hybrid}
      - CORTEX_QMD_SEARCH_TIMEOUT_SECONDS=${QMD_SEARCH_TIMEOUT_SECONDS:-120}
      - CORTEX_AUTH_METHOD=${AUTH_METHOD:-none}
      - CORTEX_API_KEY=${API_KEY:-}
      - CORTEX_OIDC_TENANT_ID=${OIDC_TENANT_ID:-}
      - CORTEX_OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - CORTEX_OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - CORTEX_OIDC_BASE_URL=${OIDC_BASE_URL:-}
      - CORTEX_TEAMS_WEBHOOK_URL=${TEAMS_WEBHOOK_URL:-}
      - CORTEX_TEAMS_APP_BASE_URL=${TEAMS_APP_BASE_URL:-}
    depends_on:
      qmd:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qmd-cache:
