services:
  qmd:
    container_name: qmd
    build:
      context: ./docker/qmd
    volumes:
      - ${VAULT_DIR:-./example_vault}:/vault:ro
      - qmd-cache:/home/qmd/.cache/qmd
    environment:
      - VAULT_PATH=/vault
      - QMD_PORT=3100
      - QMD_REFRESH_INTERVAL_SECONDS=${QMD_REFRESH_INTERVAL_SECONDS:-900}
    ports:
      - "3100:3100"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  cortex:
    container_name: pulse8-ai-cortex
    build: .
    ports:
      - "8420:8420"
    volumes:
      - ${VAULT_DIR:-./example_vault}:/vault
      - ${INGEST_DIR:-./ingest}:/ingest:ro
    environment:
      - CORTEX_VAULT_PATH=/vault
      - CORTEX_LLM_API_KEY=${LLM_API_KEY:-}
      - CORTEX_LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - CORTEX_COMPILER_MODEL=${COMPILER_MODEL:-anthropic/claude-sonnet-4}
      - CORTEX_MCP_TRANSPORT=http
      - CORTEX_QMD_URL=http://qmd:3100
      - CORTEX_QMD_REFRESH_INTERVAL_SECONDS=${QMD_REFRESH_INTERVAL_SECONDS:-900}
      - CORTEX_MASKING_ENABLED=${MASKING_ENABLED:-false}
      - CORTEX_MASKING_RULES_PATH=${MASKING_RULES_PATH:-.cortex/masking-rules.md}
      - CORTEX_MASKING_MODEL=${MASKING_MODEL:-}
    depends_on:
      qmd:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qmd-cache:
