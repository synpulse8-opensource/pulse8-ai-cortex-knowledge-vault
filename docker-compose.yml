services:
  qmd:
    build:
      context: ./docker/qmd
    volumes:
      - ./vault:/vault:ro
      - qmd-cache:/home/qmd/.cache/qmd
    environment:
      - VAULT_PATH=/vault
      - QMD_PORT=3100
    ports:
      - "3100:3100"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  cortex:
    build: .
    ports:
      - "8420:8420"
    volumes:
      - ./vault:/vault
    environment:
      - CORTEX_VAULT_PATH=/vault
      - CORTEX_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CORTEX_COMPILER_MODEL=claude-sonnet-4-20250514
      - CORTEX_MCP_TRANSPORT=http
      - CORTEX_QMD_URL=http://qmd:3100
    depends_on:
      qmd:
        condition: service_healthy
    restart: unless-stopped

volumes:
  qmd-cache:
