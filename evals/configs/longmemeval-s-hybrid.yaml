# LongMemEval-S against Cortex with hybrid search.
#
# Reproduction:
#   ./scripts/start.sh
#   uv run python -m evals.run_longmemeval --config evals/configs/longmemeval-s-hybrid.yaml
#
# Everything below is pinned; a published run is this file + the traces
# artifact it produces under evals/out/.

name: longmemeval-s-hybrid
benchmark: longmemeval

dataset:
  name: longmemeval_s_cleaned
  # Official dataset: https://github.com/xiaowu0162/LongMemEval — the
  # original longmemeval dataset is deprecated in favor of the cleaned
  # release (noisy history sessions removed), which is what published
  # numbers now use.
  url: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json
  # Pinned from the 2026-07-26 download (277,383,467 bytes):
  #   shasum -a 256 evals/data/longmemeval_s_cleaned.json
  sha256: "d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442"
  path: evals/data/longmemeval_s_cleaned.json

cortex:
  base_url: http://localhost:8420
  search_mode: hybrid
  top_k: 8

models:
  answer: anthropic/claude-sonnet-4
  judge: openai/gpt-4o   # must differ from answer model (enforced)

seed: 42
output_dir: evals/out
