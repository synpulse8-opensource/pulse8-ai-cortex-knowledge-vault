name: "Build and push Cortex container to JFrog"

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  SERVER_USERNAME: ${{ secrets.JFROG_USER }}
  SERVER_PASSWORD: ${{ secrets.JFROG_TOKEN }}

permissions:
  contents: read
  id-token: write

jobs:
  buildAndPushCortex:
    runs-on: ubuntu-latest
    environment:
      name: ${{github.ref_name}}
    steps:
      - uses: actions/checkout@v4

      - name: "Build and push Cortex container"
        uses: synpulse-group/s8-actions/custom-build-push-container@main
        with:
          docker-build-context-location: .
          docker-file-path: ./Dockerfile # using our custom Dockerfile in the repo root
          jfrog-user: ${{ secrets.JFROG_USER }} # no need to change - available in all workflows in the organisation
          jfrog-password: ${{ secrets.JFROG_TOKEN }} # no need to change - available in all workflows in the organisation
          image-name-suffix: -cortex-vault

  buildAndPushQMD:
    runs-on: ubuntu-latest
    environment:
      name: ${{github.ref_name}}
    steps:
      - uses: actions/checkout@v4

      - name: "Build and push QMD container"
        uses: synpulse-group/s8-actions/custom-build-push-container@main
        with:
          docker-build-context-location: ./docker/qmd
          docker-file-path: ./docker/qmd/Dockerfile
          jfrog-user: ${{ secrets.JFROG_USER }}
          jfrog-password: ${{ secrets.JFROG_TOKEN }}
          image-name-suffix: -cortex-vault-qmd